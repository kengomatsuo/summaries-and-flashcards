# Summaries and Flashcards — minimal monochrome theme (white, near-black, serif headings).
# Robust theming via Streamlit's native [theme] config (no fragile CSS hacks).
[theme]
base = "light"
primaryColor = "#1a1a1a"            # near-black accent: buttons, focus, progress
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f4"
textColor = "#1a1a1a"
font = "sans-serif"
headingFont = "Georgia, serif"
codeFont = "monospace"
baseRadius = "medium"
borderColor = "#e3e3e3"
showWidgetBorder = true

[client]
toolbarMode = "minimal"             # hide the developer/deploy chrome
